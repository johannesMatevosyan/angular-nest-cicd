services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: taskmanager
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        DATABASE_URL: postgresql://postgres:localdev@db:5432/taskmanager
        DIRECT_URL: postgresql://postgres:localdev@db:5432/taskmanager
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:localdev@db:5432/taskmanager
      DIRECT_URL: postgresql://postgres:localdev@db:5432/taskmanager
      FRONTEND_URL: http://localhost:4200
      PORT: '3000'
    ports:
      - '3000:3000'
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        API_URL: http://localhost:3000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '4200:80'
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
